# This file defines the build and deployment steps for Google Cloud Build.

steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/${PROJECT_ID}/druv-backend:$COMMIT_SHA', '.']

  # 2. Push the container image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/${PROJECT_ID}/druv-backend:$COMMIT_SHA']

  # 3. Deploy the container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'druv-backend'
      - '--image=gcr.io/${PROJECT_ID}/druv-backend:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'

# This specifies the image that will be available after all build steps are complete.
images:
  - 'gcr.io/${PROJECT_ID}/druv-backend:$COMMIT_SHA'

# Use Cloud Logging Only to resolve the logging permissions issue.
options:
  logging: CLOUD_LOGGING_ONLY